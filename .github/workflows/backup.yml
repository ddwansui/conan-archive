name: backup-progress
# Reads the synced progress every 3 days: keeps the textdb record alive (it expires after 30 idle days)
# and commits a copy here, which the page restores from if the record is ever lost.
on:
  schedule:
    - cron: "23 3 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch progress
        run: |
          curl -fsS -m 30 "https://textdb.online/conan-archive-VRM1TuuEqvDVBOatadX7Jk" -o new.json || exit 0
          python3 -c "import json; d=json.load(open('new.json')); assert isinstance(d.get('done'), list)" || exit 0
          if cmp -s new.json progress-backup.json; then exit 0; fi
          mv new.json progress-backup.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress-backup.json
          git commit -m "Back up watch progress"
          git push
