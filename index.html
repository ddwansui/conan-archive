<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2f57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="柯南档案">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>柯南观看档案</title>
<style>
/* Layout: 侦探事务所的卷宗柜 — 藏青西装色的"下一案件"主卡（放大镜进度表），下面是一份份编号案件档案 */
:root{
  --bg:#edf1f7; --paper:#ffffff; --paper2:#f5f7fb; --ink:#152240; --muted:#5c6886; --line:#d7deeb;
  --navy:#1b2f57; --navy2:#26407a; --onnavy:#f3f6fc; --onnavy-muted:#a9b7d6; --onnavy-line:rgba(255,255,255,.16);
  --red:#d42a3c; --red-ink:#b81f31; --red-soft:#fce6e9; --gold:#e3a234; --ok:#1d9a68;
  --hl:#e3ebfb; --flash:#ffe9a8;
  --a-bg:#1c1e26; --a-fg:#ffffff; --b-bg:#dde6f8; --b-fg:#1d3a78; --c-bg:#fbecd0; --c-fg:#7a4f05;
  --shadow:0 1px 2px rgba(21,34,64,.06),0 10px 30px rgba(21,34,64,.10);
  --f-display:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --f-mono:"Courier New",Courier,ui-monospace,Menlo,monospace;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1120; --paper:#121b2e; --paper2:#172238; --ink:#e6ebf5; --muted:#8e9ab5; --line:#24314b;
    --navy:#14254a; --navy2:#1d3466; --onnavy:#f1f4fb; --onnavy-muted:#9fb0d4; --onnavy-line:rgba(255,255,255,.14);
    --red:#ff4b5c; --red-ink:#ff6b7a; --red-soft:#3a1720; --gold:#f2b84b; --ok:#3fcf94;
    --hl:#192a4d; --flash:#4a3d12;
    --a-bg:#e6ebf5; --a-fg:#0a1120; --b-bg:#22396b; --b-fg:#d6e2ff; --c-bg:#4a3812; --c-fg:#ffd98a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1120; --paper:#121b2e; --paper2:#172238; --ink:#e6ebf5; --muted:#8e9ab5; --line:#24314b;
  --navy:#14254a; --navy2:#1d3466; --onnavy:#f1f4fb; --onnavy-muted:#9fb0d4; --onnavy-line:rgba(255,255,255,.14);
  --red:#ff4b5c; --red-ink:#ff6b7a; --red-soft:#3a1720; --gold:#f2b84b; --ok:#3fcf94;
  --hl:#192a4d; --flash:#4a3d12;
  --a-bg:#e6ebf5; --a-fg:#0a1120; --b-bg:#22396b; --b-fg:#d6e2ff; --c-bg:#4a3812; --c-fg:#ffd98a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.sync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);cursor:default;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="ok"] i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.sync[data-s="saving"] i,.sync[data-s="loading"] i{background:var(--gold);animation:pulse 1s infinite}
.sync[data-s="error"]{cursor:pointer;color:var(--red-ink);border-color:var(--red)}
.sync[data-s="error"] i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--navy);color:var(--onnavy);border-radius:20px;padding:26px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 300px at 0% 0%,color-mix(in srgb,var(--navy2) 90%,transparent),transparent 70%),
  repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px);pointer-events:none}
.hero>*{position:relative}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge svg{width:100%;max-width:200px;height:auto;display:block}
.gauge .cap{font-size:12.5px;color:var(--onnavy-muted);text-align:center;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.next h2{margin:6px 0 8px;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4.6vw,36px);line-height:1.25;text-wrap:balance;letter-spacing:.02em}
.next .star-big{color:var(--gold);margin-right:.2em}
.hmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--onnavy-muted);margin-bottom:8px}
.hmeta b{color:var(--onnavy);font-weight:600}
.hwhy{margin:0 0 14px;color:var(--onnavy);opacity:.9;font-size:14px;max-width:60ch}
.heps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.heps .ep{background:rgba(255,255,255,.08);border-color:var(--onnavy-line);color:var(--onnavy)}
.heps .ep:hover{background:rgba(255,255,255,.16)}
.hact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .12s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn-play{background:var(--red);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--red) 40%,transparent)}
.btn-play:hover{background:var(--red-ink)}
.btn-done{background:transparent;border-color:var(--onnavy-line);color:var(--onnavy)}
.btn-done:hover{background:rgba(255,255,255,.08)}
.hlast{margin-top:12px;font-size:12.5px;color:var(--onnavy-muted);min-height:1em}
.hero.finished{grid-template-columns:200px minmax(0,1fr)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 20px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .k{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.stat .v small{font-size:13px;color:var(--muted);font-weight:400}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:9px;background:var(--red);transition:width .4s ease}

/* toolbar */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.fchip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--paper2)}
.search{flex:1 1 160px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:8px 12px 8px 34px;font:inherit;font-size:14px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.locate{border:1px solid var(--red);color:var(--red-ink);background:var(--paper);border-radius:11px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.count{width:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.case{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:14px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 10px;transition:background .3s ease}
.case.current{background:var(--hl);border-color:color-mix(in srgb,var(--navy2) 45%,var(--line))}
.case.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--flash)}}
.no{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
.no .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--muted)}
.no .fno{font-family:var(--f-mono);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.case.done .fno{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.range{font-family:var(--f-mono);font-weight:700;color:var(--ink);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
.tA{background:var(--a-bg);color:var(--a-fg)} .tB{background:var(--b-bg);color:var(--b-fg)} .tC{background:var(--c-bg);color:var(--c-fg)}
.st{color:var(--gold);font-weight:700}
.xpick{border:1px solid var(--gold);color:var(--c-fg);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:700}
.nowpill{background:var(--navy);color:var(--onnavy);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700}
.ttl{margin:3px 0 2px;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.35;text-wrap:balance}
.case.done .ttl{color:var(--muted)}
.why{margin:0 0 8px;font-size:13px;color:var(--muted)}
.eps{display:flex;flex-wrap:wrap;gap:5px}
.ep{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper2);text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;transition:background .15s ease,border-color .15s ease}
.ep:hover{border-color:var(--red);color:var(--red-ink)}
.ep .pl{font-size:9px;margin-right:4px;opacity:.7}
.ep.soon{border-style:dashed;opacity:.75}
.ep.seen{color:var(--muted);background:transparent;border-style:dashed}
.ep.seen::before{content:"✓";font-size:10px;margin-right:3px;color:var(--ok)}
.bili{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:-6px 0 14px;font-size:12.5px;color:var(--muted)}
.bili b{color:var(--ink);font-weight:600}
.bili button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.bili button:hover{border-color:var(--red);color:var(--red-ink)}
.bili .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.bili[data-s="ok"] .dot{background:var(--ok)}
.bili[data-s="syncing"] .dot{background:var(--gold);animation:pulse 1s infinite}
.bili[data-s="error"] .dot,.bili[data-s="loggedOut"] .dot{background:var(--red)}
.ep.vip::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid var(--paper)}
.heps .ep.vip::after{border-color:var(--navy)}
.ep.last{border-color:var(--red);box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 30%,transparent)}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;color:transparent;transition:all .15s ease}
.chk:hover{border-color:var(--red);color:color-mix(in srgb,var(--red) 50%,transparent)}
.chk[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.stamp{position:absolute;right:66px;top:12px;pointer-events:none;font-family:var(--f-display);font-weight:900;font-size:14px;letter-spacing:.2em;padding:3px 6px 3px 9px;border:2.5px double currentColor;border-radius:6px;transform:rotate(-9deg);opacity:.82}
.case.done .stamp{color:var(--red)}
.case.current .stamp{color:var(--navy2)}
:root[data-theme="dark"] .case.current .stamp{color:var(--onnavy-muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .case.current .stamp{color:var(--onnavy-muted)}}
.case.just .stamp{animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:rotate(-20deg) scale(2.2);opacity:0}100%{transform:rotate(-9deg) scale(1);opacity:.82}}
.empty{text-align:center;padding:40px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.notice{margin:-6px 0 18px;padding:10px 14px;border-radius:12px;background:var(--paper);border:1px dashed var(--line);font-size:13px;color:var(--muted)}

footer{margin-top:28px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer .lg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
footer .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:middle}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;font-size:14px;box-shadow:var(--shadow);transition:all .25s ease;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:transparent;color:var(--gold);font-weight:700;cursor:pointer;padding:4px 6px;flex:none}

@media (max-width:720px){
  .hero{grid-template-columns:1fr;gap:16px;padding:20px 18px}
  .gauge{flex-direction:row;gap:14px;align-items:center;justify-content:flex-start}
  .gauge svg{width:110px}
  .gauge .cap{text-align:left}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .case{grid-template-columns:44px minmax(0,1fr) 40px;gap:10px;padding:12px 10px 12px 6px}
  .no .fno{font-size:17px}
  .no .lbl{font-size:9px;letter-spacing:.1em}
  .chk{width:36px;height:36px}
  .stamp{top:auto;bottom:12px;right:10px;font-size:12px}
  .case.done .eps,.case.current .eps{padding-right:72px}
  .ttl{font-size:16.5px}
  .brand h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="46" height="30" viewBox="0 0 46 30" aria-hidden="true">
        <path d="M21 15 L3 3.5 Q1 2.5 1 5 L1 25 Q1 27.5 3 26.5 Z" fill="var(--red)"/>
        <path d="M25 15 L43 3.5 Q45 2.5 45 5 L45 25 Q45 27.5 43 26.5 Z" fill="var(--red)"/>
        <path d="M7 9 L16 14.5 M7 21 L16 15.5 M39 9 L30 14.5 M39 21 L30 15.5" stroke="var(--red-ink)" stroke-width="1.4" opacity=".5" fill="none"/>
        <rect x="18" y="9.5" width="10" height="11" rx="3" fill="var(--red-ink)"/>
      </svg>
      <div>
        <h1>柯南观看档案</h1>
        <p id="sub">名侦探柯南（中配）精选观看名单 · 真相只有一个</p>
      </div>
    </div>
    <button class="sync" id="sync" data-s="loading" type="button"><i></i><span>正在连接云端…</span></button>
  </header>

  <div class="bili" id="bili" hidden></div>
  <section class="hero" id="hero" aria-live="polite"></section>
  <div class="stats" id="stats"></div>
  <div class="notice" id="notice" hidden></div>

  <div class="tools" id="tools">
    <div class="seg" role="group" aria-label="观看状态">
      <button type="button" id="fs-all" data-s="all">全部</button>
      <button type="button" id="fs-todo" data-s="todo">待看</button>
      <button type="button" id="fs-done" data-s="done">已看</button>
    </div>
    <button type="button" class="fchip" id="fc-A" data-c="A">A 主线</button>
    <button type="button" class="fchip" id="fc-B" data-c="B">B 人物</button>
    <button type="button" class="fchip" id="fc-C" data-c="C">C 案件</button>
    <button type="button" class="fchip" id="fc-S" data-c="S">★ 重点</button>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="搜标题、集数（如 545）" aria-label="搜索案件">
    </label>
    <button type="button" class="locate" id="locate">定位下一篇</button>
    <div class="count" id="count"></div>
  </div>

  <main class="list" id="list"></main>

  <footer>
    <div class="lg">
      <span><span class="tag tA">主线</span> A＝主线／身份</span>
      <span><span class="tag tB">人物</span> B＝人物／衔接</span>
      <span><span class="tag tC">案件</span> C＝精品案件</span>
      <span><span class="dot"></span>需B站大会员</span>
    </div>
    <div>集数均为B站《名侦探柯南（中配）》拆分编号，点集数直接跳到B站对应那一集。名单整理于 2026-10-06，B站链接同日生成。</div>
    <div>电脑和手机打开同一个网址就会自动同步进度，不用登录。进度存在 textdb.online，并定期备份到 GitHub。</div>
  </footer>
</div>

function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(3, '0');
const range = e => e.a === e.b ? `第${e.a}集` : `第${e.a}—${e.b}集`;
const epsOf = e => { const r = []; for (let k = e.a; k <= e.b; k++) r.push(k); return r; };
// an episode not yet on B站 has ep id 0: link to the series page, which opens the latest episode
const epUrl = k => EP[k][0] ? `https://www.bilibili.com/bangumi/play/ep${EP[k][0]}` : 'https://www.bilibili.com/bangumi/play/ss33415';
const CAT = {A:'主线', B:'人物', C:'案件'};

// ---- state ----
const state = { done: new Set(), last: null, eps: new Set() };   // eps: single episodes B站 says you finished
const cached = normalize(lsGet(LS));
if (cached) { state.done = new Set(cached.done || []); state.last = cached.last || null; state.eps = new Set(cached.eps || []); }
const ui = Object.assign({ s: 'all', cats: [], q: '' }, lsGet(LSUI) || {});
ui.q = '';
let cloudEmpty = false, readonly = false, justN = null;

function current(){ return E.find(e => !state.done.has(e.a)) || null; }
function watchedEps(){ let s = 0; for (const a of state.done){ const e = byA.get(a); if (e) s += e.b - e.a + 1; } return s; }

// ---- render ----
function epChip(k, e, opts = {}){
  const [, vip, title] = EP[k];
  const isLast = state.last && state.last.ep === k, seen = state.eps.has(k);
  const tip = EP[k][0] ? `B站 第${k}集 ${title}${vip ? '（需大会员）' : ''}${seen ? ' · 已看完' : ''}${isLast ? ' · 上次打开' : ''}` : `第${k}集还没在B站上线，点这里打开B站最新一集`;
  return `<a class="ep${vip ? ' vip' : ''}${isLast ? ' last' : ''}${seen ? ' seen' : ''}${EP[k][0] ? '' : ' soon'}" href="${epUrl(k)}" target="_blank" rel="noopener" data-ep="${k}" data-a="${e.a}" title="${esc(tip)}" aria-label="${esc(tip)}">${opts.play ? '<span class="pl">▶</span>' : ''}${k}</a>`;
}

function gaugeSVG(doneCount){
  const C = 2 * Math.PI * 60, p = doneCount / E.length;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="已看 ${doneCount} / ${E.length} 篇">
    <line x1="132" y1="132" x2="186" y2="186" stroke="var(--gold)" stroke-width="15" stroke-linecap="round"/>
    <line x1="152" y1="152" x2="183" y2="183" stroke="#0d1730" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>
    <circle cx="86" cy="86" r="72" fill="rgba(255,255,255,.05)" stroke="var(--gold)" stroke-width="7"/>
    <circle cx="86" cy="86" r="60" fill="none" stroke="var(--onnavy-line)" stroke-width="9"/>
    <circle cx="86" cy="86" r="60" fill="none" stroke="var(--red)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 86 86)"/>
    <path d="M50 52 Q62 38 80 34" stroke="rgba(255,255,255,.35)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="86" y="92" text-anchor="middle" font-family="Courier Prime, Courier New, monospace" font-weight="700" font-size="40" fill="var(--onnavy)">${doneCount}</text>
    <text x="86" y="114" text-anchor="middle" font-family="Courier Prime, Courier New, monospace" font-size="13" fill="var(--onnavy-muted)">/ ${E.length} 篇</text>
  </svg>`;
}

function mmss(s){ s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function fmtTime(t){
  const d = new Date(t); if (isNaN(d)) return '';
  const p = x => String(x).padStart(2, '0');
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderHero(){
  const done = state.done.size, cur = current(), we = watchedEps();
  const pct = Math.round(we / TOTAL_EPS * 100);
  const gauge = `<div class="gauge">${gaugeSVG(done)}<div class="cap">已看 ${we} / ${TOTAL_EPS} 集<br>调查进度 ${pct}%</div></div>`;
  if (!cur){
    $('hero').innerHTML = gauge + `<div class="next"><div class="eyebrow">Case closed</div><h2>全部 ${E.length} 篇已结案</h2><p class="hwhy">整份精选名单都看完了。想重温哪一篇，在下面的档案里点集数就能跳到B站。</p></div>`;
    return;
  }
  // resume at the episode left half-watched, else the first episode of this entry not yet finished
  const unseen = epsOf(cur).filter(k => !state.eps.has(k));
  let resume = unseen.length ? unseen[0] : cur.a;
  if (state.last && state.last.a === cur.a && !state.eps.has(state.last.ep)) resume = state.last.ep;
  const resumed = resume !== cur.a || (state.last && state.last.a === cur.a);
  const pos = state.last && state.last.pos > 0 ? ` 看到 ${mmss(state.last.pos)}` : '';
  const lastLine = state.last ? `上次看到：第${state.last.ep}集《${esc(byA.get(state.last.a)?.t || '')}》${pos} · ${fmtTime(state.last.at)}` : '点集数会记下你上次打开的是哪一集';
  $('hero').innerHTML = gauge + `<div class="next">
    <div class="eyebrow">下一案件 · File ${pad(cur.n)}</div>
    <h2>${cur.s ? '<span class="star-big">★</span>' : ''}${esc(cur.t)}</h2>
    <div class="hmeta"><span><b>${range(cur)}</b></span><span>日版参照 ${esc(cur.jp)}</span><span><span class="tag t${cur.c}">${CAT[cur.c]}</span></span></div>
    <p class="hwhy">${esc(cur.r)}</p>
    <div class="heps">${epsOf(cur).map(k => epChip(k, cur)).join('')}</div>
    <div class="hact">
      <a class="btn btn-play" href="${epUrl(resume)}" target="_blank" rel="noopener" data-ep="${resume}" data-a="${cur.a}">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z" fill="currentColor"/></svg>
        ${resumed ? '继续看' : '去B站看'}第${resume}集</a>
      <button type="button" class="btn btn-done" data-toggle="${cur.a}" ${readonly ? 'disabled' : ''}>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        看完了，下一篇</button>
    </div>
    <div class="hlast">${lastLine}</div>
  </div>`;
}

function renderStats(){
  const groups = [
    ['A 主线·身份', e => e.c === 'A'], ['B 人物·衔接', e => e.c === 'B'],
    ['C 精品案件', e => e.c === 'C'], ['★ 重点推荐', e => e.s]
  ];
  $('stats').innerHTML = groups.map(([label, f]) => {
    const all = E.filter(f), d = all.filter(e => state.done.has(e.a)).length;
    return `<div class="stat"><div class="k"><span>${label}</span></div>
      <div class="v">${d}<small> / ${all.length}</small></div>
      <div class="bar"><span style="width:${(d / all.length * 100).toFixed(1)}%"></span></div></div>`;
  }).join('');
}

function matches(e){
  if (ui.s === 'todo' && state.done.has(e.a)) return false;
  if (ui.s === 'done' && !state.done.has(e.a)) return false;
  const cats = ui.cats.filter(c => c !== 'S');
  if (cats.length && !cats.includes(e.c)) return false;
  if (ui.cats.includes('S') && !e.s) return false;
  const q = ui.q.trim();
  if (q){
    if (/^\d+$/.test(q)){ const k = +q; if (!(k >= e.a && k <= e.b) && e.n !== k) return false; }
    else {
      const hay = e.t + e.r + epsOf(e).map(k => EP[k][2]).join('');
      if (!hay.toLowerCase().includes(q.toLowerCase())) return false;
    }
  }
  return true;
}

function renderList(){
  const cur = current();
  const rows = E.filter(matches);
  $('count').textContent = `显示 ${rows.length} / ${E.length} 篇`;
  if (!rows.length){ $('list').innerHTML = `<div class="empty">没有符合条件的案件。换个关键词，或者点“全部”看完整名单。</div>`; return; }
  $('list').innerHTML = rows.map(e => {
    const done = state.done.has(e.a), isCur = cur && cur.a === e.a;
    const cls = `case${done ? ' done' : ''}${isCur ? ' current' : ''}${justN === e.a ? ' just' : ''}`;
    const stamp = done ? '<span class="stamp" aria-hidden="true">已结案</span>' : isCur ? '<span class="stamp" aria-hidden="true">调查中</span>' : '';
    return `<article class="${cls}" id="f${pad(e.n)}">
      <div class="no"><span class="lbl">FILE</span><span class="fno">${pad(e.n)}</span></div>
      <div class="main">
        <div class="meta"><span class="range">${range(e)}</span><span class="tag t${e.c}">${CAT[e.c]}</span>${e.s ? '<span class="st">★ 重点</span>' : ''}${e.x ? `<span class="xpick">${e.x === 2 ? '主线补充' : '众评补充'}</span>` : ''}${isCur ? '<span class="nowpill">下一篇</span>' : ''}<span>日版 ${esc(e.jp)}</span></div>
        <h3 class="ttl">${esc(e.t)}</h3>
        <p class="why">${esc(e.r)}</p>
        <div class="eps">${epsOf(e).map((k, i) => epChip(k, e, {play: i === 0})).join('')}</div>
      </div>
      <button type="button" class="chk" data-toggle="${e.a}" aria-pressed="${done}" aria-label="${done ? '取消已看' : '标记看完'}：${esc(e.t)}" ${readonly ? 'disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      ${stamp}
    </article>`;
  }).join('');
}

function renderTools(){
  ['all', 'todo', 'done'].forEach(s => {
    const b = $('fs-' + s);
    const n = s === 'all' ? E.length : s === 'done' ? state.done.size : E.length - state.done.size;
    b.textContent = `${{all:'全部', todo:'待看', done:'已看'}[s]} ${n}`;
    b.setAttribute('aria-pressed', ui.s === s);
  });
  ['A', 'B', 'C', 'S'].forEach(c => $('fc-' + c).setAttribute('aria-pressed', ui.cats.includes(c)));
}

function renderNotice(){
  const n = $('notice');
  const msg = cloudEmpty && state.done.size === 0 ? '还没有观看记录。看完一篇就点右边的圆圈，进度会自动同步到你所有设备。' : '';
  n.hidden = !msg; n.textContent = msg;
}

function renderAll(){ renderHero(); renderStats(); renderTools(); renderNotice(); renderList(); justN = null; }

// ---- sync status ----
function setSync(s){
  const el = $('sync'); el.dataset.s = s;
  el.querySelector('span').textContent = {
    loading: '正在读取进度…', ok: '已同步', pending: '等待保存…', saving: '正在保存…',
    offline: '离线 · 已存在本机', error: '同步失败 · 点此重试'
  }[s];
}

// ---- persistence: textdb.online (no login), backed up to GitHub by a scheduled job ----
const SYNC_KEY = 'conan-archive-VRM1TuuEqvDVBOatadX7Jk';
const DB_READ = 'https://textdb.online/' + SYNC_KEY;
const DB_WRITE = 'https://textdb.online/update';
let localAt = (cached && cached.at) || 0;   // time of the last change made on any device we adopted
let dirty = !!(cached && cached.dirty);     // a change on this device not yet uploaded
let writeTimer = null, writing = false, again = false;

function saveLocal(){ lsSet(LS, { v: 2, done: [...state.done], eps: [...state.eps], last: state.last, at: localAt, dirty }); }
function sorted(){ return [...state.done].sort((a, b) => a - b); }
function snapshot(){ return JSON.stringify({ v: 2, done: sorted(), eps: [...state.eps].sort((a, b) => a - b), last: state.last, at: localAt }); }
function parse(t){ try { const d = JSON.parse(t); return d && Array.isArray(d.done) ? normalize(d) : null; } catch (e){ return null; } }
function adopt(d){
  const key = (done, eps, last) => JSON.stringify([done.slice().sort((a, b) => a - b), eps.slice().sort((a, b) => a - b), last || null]);
  const same = key(d.done, d.eps || [], d.last) === key([...state.done], [...state.eps], state.last);
  state.done = new Set(d.done); state.eps = new Set(d.eps || []); state.last = d.last || null; localAt = d.at || 0; dirty = false; saveLocal();
  if (!same) renderAll();
}
async function readRemote(){
  const r = await fetch(DB_READ + '?_=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('read ' + r.status);
  return parse((await r.text()).trim());
}
async function readBackup(){
  try { const r = await fetch('progress-backup.json?_=' + Date.now(), { cache: 'no-store' }); return r.ok ? parse(await r.text()) : null; }
  catch (e){ return null; }
}
function failState(){ setSync(navigator.onLine === false ? 'offline' : 'error'); }

function persist(){
  localAt = Date.now(); dirty = true; saveLocal();
  setSync('pending');
  clearTimeout(writeTimer); writeTimer = setTimeout(upload, 1200);
}
async function upload(){
  clearTimeout(writeTimer); writeTimer = null;
  if (writing){ again = true; return; }
  writing = true; setSync('saving');
  const sentAt = localAt;
  try {
    const r = await fetch(DB_WRITE, { method: 'POST', body: new URLSearchParams({ key: SYNC_KEY, value: snapshot() }) });
    const j = await r.json();
    if (!j || j.status !== 1) throw new Error('write rejected');
    if (localAt === sentAt) dirty = false;
    cloudEmpty = false; saveLocal(); setSync(dirty ? 'pending' : 'ok'); renderNotice();
  } catch (e){ failState(); }
  writing = false;
  if (again){ again = false; upload(); }
}
async function pull(){
  if (writing || writeTimer) return true;   // a local change is about to be uploaded: it is the newest
  try {
    const remote = await readRemote();
    if (!remote){
      // Nothing on the server (first run, or the record expired): restore from the GitHub backup if it is newer.
      cloudEmpty = true;
      const b = await readBackup();
      if (b && !dirty && (b.at || 0) > localAt) adopt(b);
      if (state.done.size || state.last){ dirty = true; upload(); } else { setSync('ok'); renderAll(); }
      return true;
    }
    cloudEmpty = false;
    if (dirty && localAt > (remote.at || 0)){ upload(); return true; }
    adopt(remote);
    setSync('ok'); renderNotice();
    return true;
  } catch (e){ failState(); return false; }
}
$('sync').addEventListener('click', () => { if ($('sync').dataset.s === 'error' || $('sync').dataset.s === 'offline') dirty ? upload() : pull(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
window.addEventListener('online', () => { dirty ? upload() : pull(); });
setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 30000);

// ---- actions ----
let toastTimer = null, undoFn = null;
function toast(msg, undo){
  $('toastMsg').textContent = msg; undoFn = undo || null;
  $('toastUndo').hidden = !undo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4500);
}
$('toastUndo').addEventListener('click', () => { if (undoFn){ undoFn(); undoFn = null; } $('toast').classList.remove('show'); });

function toggle(a){
  if (readonly) return;
  const e = byA.get(a), was = state.done.has(a);
  const before = { done: new Set(state.done), eps: new Set(state.eps), last: state.last };
  if (was){ state.done.delete(a); epsOf(e).forEach(k => state.eps.delete(k)); } else { state.done.add(a); justN = a; }
  persist(); renderAll();
  const nx = current();
  toast(was ? `已取消：${e.t}` : `已结案：${e.t}${nx ? ' · 下一篇 ' + nx.t : ''}`, () => {
    state.done = before.done; state.eps = before.eps; state.last = before.last; persist(); renderAll();
  });
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-toggle]');
  if (t){ toggle(+t.dataset.toggle); return; }
  const a = ev.target.closest('a[data-ep]');
  if (a){
    state.last = { a: +a.dataset.a, ep: +a.dataset.ep, at: Date.now() };
    persist();
    setTimeout(renderAll, 50);
  }
  const s = ev.target.closest('.seg button');
  if (s){ ui.s = s.dataset.s; saveUI(); renderTools(); renderList(); return; }
  const c = ev.target.closest('.fchip');
  if (c){ const k = c.dataset.c; ui.cats = ui.cats.includes(k) ? ui.cats.filter(x => x !== k) : [...ui.cats, k]; saveUI(); renderTools(); renderList(); }
});
function saveUI(){ lsSet(LSUI, { s: ui.s, cats: ui.cats }); }
let qTimer = null;
$('q').addEventListener('input', ev => { clearTimeout(qTimer); qTimer = setTimeout(() => { ui.q = ev.target.value; renderList(); }, 120); });
$('locate').addEventListener('click', () => {
  const cur = current(); if (!cur) return;
  if (!matches(cur)){ ui.s = 'all'; ui.cats = []; ui.q = ''; $('q').value = ''; saveUI(); renderTools(); renderList(); }
  const el = $('f' + pad(cur.n)); if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - $('tools').offsetHeight - 16;
  window.scrollTo({ top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
});

// ---- B站 sync: only inside the Mac app. The app signs in to B站 and reads your watch history itself;
// this page only receives {epid, progress, duration, viewAt} records and never sees the login. ----
const IN_APP = !!window.__biliApp;
const EP_BY_ID = new Map(); for (const k in EP) if (EP[k][0]) EP_BY_ID.set(EP[k][0], +k);
const entryOfEp = k => E.find(e => k >= e.a && k <= e.b);
function biliPost(msg){ try { window.webkit.messageHandlers.bili.postMessage(msg); } catch (e){} }
const bili = { s: 'syncing', at: 0, newly: 0, msg: '' };
function renderBili(){
  const el = $('bili'); if (!IN_APP){ el.hidden = true; return; }
  el.hidden = false; el.dataset.s = bili.s;
  const p = x => String(x).padStart(2, '0'), t = bili.at ? new Date(bili.at) : null;
  const when = t ? `${p(t.getHours())}:${p(t.getMinutes())}` : '';
  el.innerHTML = {
    syncing: '<span class="dot"></span><span>正在读取B站观看记录…</span>',
    ok: `<span class="dot"></span><span>B站同步：<b>${when}</b> 已同步${bili.newly ? ` · 新看完 <b>${bili.newly}</b> 篇` : ''}</span><button type="button" data-bili="sync">立即同步</button>`,
    loggedOut: '<span class="dot"></span><span>B站未登录，登录后会自动按你在B站的观看记录打勾</span><button type="button" data-bili="login">登录B站</button>',
    error: `<span class="dot"></span><span>B站同步失败：${esc(bili.msg || '请稍后再试')}</span><button type="button" data-bili="sync">重试</button>`
  }[bili.s] || '';
}
window.biliStatus = s => { Object.assign(bili, s); renderBili(); };
window.applyBiliHistory = async items => {
  if (!(await pull())){ window.biliStatus({ s: 'error', msg: '云端进度读取失败' }); return; }
  let changed = false, latest = null, maxView = 0;
  for (const it of items){
    maxView = Math.max(maxView, it.viewAt || 0);
    const k = EP_BY_ID.get(it.epid); if (!k) continue;          // not an episode of this list
    const finished = it.progress === -1 || (it.duration > 0 && it.progress >= it.duration * 0.9);
    if (finished && !state.eps.has(k)){ state.eps.add(k); changed = true; }
    if (!latest || it.viewAt > latest.viewAt) latest = Object.assign({ k, finished }, it);
  }
  const newly = [];
  for (const e of E){
    if (!state.done.has(e.a) && epsOf(e).every(k => state.eps.has(k))){ state.done.add(e.a); newly.push(e); changed = true; }
  }
  if (latest && (!state.last || latest.viewAt * 1000 > (state.last.at || 0))){
    const e = entryOfEp(latest.k);
    if (e){ state.last = { a: e.a, ep: latest.k, at: latest.viewAt * 1000, pos: latest.finished ? 0 : latest.progress }; changed = true; }
  }
  if (changed){ if (newly.length) justN = newly[newly.length - 1].a; persist(); renderAll(); }
  if (newly.length) toast(`B站同步：新看完 ${newly.length} 篇 · ${newly.map(e => e.t).join('、')}`);
  window.biliStatus({ s: 'ok', at: Date.now(), newly: newly.length });
  biliPost('applied:' + maxView);
};
document.addEventListener('click', ev => { const b = ev.target.closest('[data-bili]'); if (b) biliPost(b.dataset.bili); });
renderBili();

$('sub').textContent = `名侦探柯南（中配）精选 ${E.length} 篇 · ${TOTAL_EPS} 集 · 真相只有一个`;
renderAll();
setSync('loading');
pull();
</script>
</body>
